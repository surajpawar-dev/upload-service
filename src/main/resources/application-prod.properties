# Production profile expects real infrastructure values from environment/secrets.
aws.region=${AWS_REGION}
aws.s3.endpoint=${AWS_S3_ENDPOINT:}
aws.s3.path-style-access-enabled=${AWS_S3_PATH_STYLE_ACCESS_ENABLED:false}
aws.s3.bucket-name=${AWS_S3_BUCKET}

opensearch.uris=${OPENSEARCH_URIS}
opensearch.username=${OPENSEARCH_USERNAME:}
opensearch.password=${OPENSEARCH_PASSWORD:}
app.document-processing.base-url=${DOCUMENT_PROCESSING_BASE_URL}
logging.cloudwatch.log-stream=${CLOUDWATCH_LOG_STREAM:prod}
