spring.application.name=upload-platform
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration,org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration,org.springframework.boot.autoconfigure.elasticsearch.ReactiveElasticsearchClientAutoConfiguration,org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration,org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.data.elasticsearch.ReactiveElasticsearchRepositoriesAutoConfiguration

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

aws.region=${AWS_REGION:us-east-1}
aws.s3.enabled=${AWS_S3_ENABLED:true}
aws.s3.bucket-name=${AWS_S3_BUCKET:upload/platform/book/}

opensearch.enabled=${OPENSEARCH_ENABLED:true}
spring.data.elasticsearch.repositories.enabled=${OPENSEARCH_ENABLED:true}
opensearch.uris=${OPENSEARCH_URIS:${OPENSEARCH_SCHEME:http}://${OPENSEARCH_HOST:localhost}:${OPENSEARCH_PORT:9200}}
opensearch.username=${OPENSEARCH_USERNAME:}
opensearch.password=${OPENSEARCH_PASSWORD:}

upload.small-file-max-bytes=${UPLOAD_SMALL_FILE_MAX_BYTES:10485760}
upload.multipart-min-bytes=${UPLOAD_MULTIPART_MIN_BYTES:104857600}
upload.multipart-part-size-bytes=${UPLOAD_MULTIPART_PART_SIZE_BYTES:10485760}
upload.presigned-url-expiration-minutes=${UPLOAD_PRESIGNED_URL_EXPIRATION_MINUTES:15}
upload.max-file-size-bytes=${UPLOAD_MAX_FILE_SIZE_BYTES:1048576000}

logging.cloudwatch.region=${AWS_REGION:us-east-1}
logging.cloudwatch.log-group=${CLOUDWATCH_LOG_GROUP:/upload-platform/application}
logging.cloudwatch.log-stream=${CLOUDWATCH_LOG_STREAM:local}

storage.local.directory=${STORAGE_LOCAL_DIRECTORY:./data/uploads}
