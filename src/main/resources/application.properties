spring.application.name=upload-platform

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

aws.region=${AWS_REGION:us-east-1}
aws.s3.enabled=${AWS_S3_ENABLED:true}
aws.s3.bucket-name=${AWS_S3_BUCKET:}

opensearch.enabled=${OPENSEARCH_ENABLED:true}
opensearch.scheme=${OPENSEARCH_SCHEME:http}
opensearch.host=${OPENSEARCH_HOST:localhost}
opensearch.port=${OPENSEARCH_PORT:9200}
opensearch.username=${OPENSEARCH_USERNAME:}
opensearch.password=${OPENSEARCH_PASSWORD:}

upload.small-file-max-bytes=${UPLOAD_SMALL_FILE_MAX_BYTES:10485760}
upload.multipart-min-bytes=${UPLOAD_MULTIPART_MIN_BYTES:104857600}
upload.multipart-part-size-bytes=${UPLOAD_MULTIPART_PART_SIZE_BYTES:10485760}
upload.presigned-url-expiration-minutes=${UPLOAD_PRESIGNED_URL_EXPIRATION_MINUTES:15}
upload.max-file-size-bytes=${UPLOAD_MAX_FILE_SIZE_BYTES:1048576000}

logging.cloudwatch.region=${AWS_REGION:us-east-1}
logging.cloudwatch.log-group=${CLOUDWATCH_LOG_GROUP:/upload-platform/application}
logging.cloudwatch.log-stream=${CLOUDWATCH_LOG_STREAM:local}
