# Local profile uses Docker Compose or developer-machine infrastructure.
aws.region=${AWS_REGION:us-east-1}
aws.s3.endpoint=${AWS_S3_ENDPOINT:http://localhost:4566}
aws.s3.path-style-access-enabled=${AWS_S3_PATH_STYLE_ACCESS_ENABLED:true}
aws.s3.bucket-name=${AWS_S3_BUCKET:documents}

opensearch.uris=${OPENSEARCH_URIS:http://localhost:9200}
app.document-processing.base-url=${DOCUMENT_PROCESSING_BASE_URL:http://localhost:8081}
logging.cloudwatch.log-stream=${CLOUDWATCH_LOG_STREAM:local}
